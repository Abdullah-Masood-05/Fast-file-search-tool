name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (must equal v<pyproject version>, e.g. v1.3.0). Leave empty to only build.'
        required: false
        default: ''
        type: string
      macos_profile:
        description: 'Only run the macOS GUI-thread profile (bench_app.py --profile-gui); skips tests, builds and benchmarks.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13'
  # Make uv use the interpreter from actions/setup-python (Nuitka-friendly, shared libpython)
  # instead of downloading its own.
  UV_PYTHON: '3.13'
  UV_PYTHON_PREFERENCE: only-system
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: ${{ !inputs.macos_profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Use a throwaway app cache dir
        shell: bash
        run: echo "FAST_FILE_SEARCH_CACHE_DIR=$RUNNER_TEMP/ffs-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1

      - name: Install dependencies
        run: uv sync --locked

      - name: Environment
        shell: bash
        run: |
          uv run python -c "import platform, sqlite3, sys; print('python', sys.version.split()[0]); print('sqlite3', sqlite3.sqlite_version); print('platform', platform.platform(), platform.machine())"
          {
            echo "### Test environment (${{ matrix.os }})"
            uv run python -c "import platform, sqlite3; print('- sqlite3 ' + sqlite3.sqlite_version); print('- ' + platform.platform() + ' ' + platform.machine())"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: uv run pytest -q

      # Real engine processes, the 50k-entry GUI responsiveness test and the spawn ground truth.
      - name: Run slow tests
        if: matrix.os != 'windows-latest'
        run: uv run pytest -q --run-slow

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
          # Oldest supported Ubuntu runner: glibc 2.35 is the binaries' runtime floor.
          # (Nuitka output inherits the build host's glibc, so building on the oldest runner keeps the floor low.)
          - platform: linux-x86_64
            os: ubuntu-22.04
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use a throwaway app cache dir
        shell: bash
        run: echo "FAST_FILE_SEARCH_CACHE_DIR=$RUNNER_TEMP/ffs-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Read version
        id: version
        run: echo "version=$(python build.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends patchelf ccache \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1

      - name: Install dependencies
        run: uv sync --locked

      - name: Nuitka cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ matrix.platform }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ matrix.platform }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ matrix.platform }}-

      - name: Build standalone (Nuitka)
        run: uv run python build.py --mode standalone

      - name: Build portable onefile (Windows)
        if: runner.os == 'Windows'
        run: uv run python build.py --mode onefile

      - name: Locate the built binary
        id: bin
        run: |
          case "$RUNNER_OS" in
            Windows) bin="dist/FastFileSearchPro/FastFileSearchPro.exe" ;;
            macOS)
              app="dist/Fast File Search Pro.app"
              bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" ;;
            *)       bin="dist/FastFileSearchPro/fast-file-search-pro" ;;
          esac
          test -f "$bin" || { echo "::error::binary not found: $bin"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # Starts the engine through the real (frozen) multiprocessing spawn path, indexes the fixture and
      # compares the search counts with an os.walk ground truth. Also reports sqlite and platform.
      - name: Packaged self-test
        env:
          BIN: ${{ steps.bin.outputs.bin }}
        run: |
          mkdir -p selftest-out
          "$BIN" --selftest tests/e2e/fixture_small "selftest-out/selftest-${{ matrix.platform }}.json"
          python - "selftest-out/selftest-${{ matrix.platform }}.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          line = (f"selftest ok={r['ok']} frozen={r.get('frozen')} sqlite={r.get('sqlite_version')} "
                  f"platform={r.get('platform')} child_qt_modules={r.get('child_qt_modules')} "
                  f"timings={r.get('timings')}")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Packaged self-test (${{ matrix.platform }})\n\n- " + line + "\n")
          sys.exit(0 if r["ok"] else 1)
          PY

      - name: Packaged GUI self-test
        env:
          BIN: ${{ steps.bin.outputs.bin }}
        run: '"$BIN" --selftest-gui'

      - name: Packaged self-test (portable onefile, Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p selftest-out
          dist/FastFileSearchPro.exe --selftest tests/e2e/fixture_small selftest-out/selftest-windows-onefile.json
          python -c "import json; r = json.load(open('selftest-out/selftest-windows-onefile.json', encoding='utf-8')); print('onefile selftest ok=%s sqlite=%s %s' % (r['ok'], r.get('sqlite_version'), r.get('platform')))"

      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ matrix.platform }}
          path: selftest-out/*.json
          if-no-files-found: ignore

      - name: Launch check (10 s)
        env:
          BIN: ${{ steps.bin.outputs.bin }}
        run: |
          "$BIN" & pid=$!
          sleep 10
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "--- lsappinfo (expect a single Fast File Search Pro entry, no engine child in the Dock)"
            lsappinfo list | grep -i -A2 "fast file search" || true
          fi
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "OK: $BIN is running"
          else
            wait "$pid" && code=0 || code=$?
            echo "::error::$BIN exited early with code $code"
            exit 1
          fi

      - name: Prepare installer artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $base = "Fast-File-Search-Pro-v$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          Copy-Item dist/FastFileSearchPro.exe "dist-installers/$base-Portable.exe"
          Compress-Archive -Path dist/FastFileSearchPro -DestinationPath "dist-installers/$base.zip"
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                      "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe") |
                    Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Host
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found' }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DOutputDir=$PWD\dist-installers" "/DOutputBaseFilename=$base-Setup" packaging\windows\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist-installers

      - name: Prepare installer artifacts (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-installers
          arch="$(uname -m)"
          bash packaging/macos/make-dmg.sh "dist/Fast File Search Pro.app" \
            "dist-installers/Fast-File-Search-Pro-v${VERSION}-macOS-${arch}.dmg"

      - name: Prepare installer artifacts (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash packaging/linux/build-packages.sh dist/FastFileSearchPro dist-installers
          # Arch package, built in a throwaway Arch container from the staged tree.
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/workspace" -w /workspace \
            archlinux:base-devel bash packaging/arch/build-arch.sh build/linux/root dist-installers
          sudo chown -R "$(id -u):$(id -g)" dist-installers build
          dpkg-deb --info dist-installers/*.deb
          ls -l dist-installers

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: dist-installers/*
          if-no-files-found: error

  bench:
    name: Bench (${{ matrix.os }})
    needs: test
    if: ${{ !inputs.macos_profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use a throwaway app cache dir
        run: echo "FAST_FILE_SEARCH_CACHE_DIR=$RUNNER_TEMP/ffs-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1

      # The benchmark window is headless and in the background, so macOS App Nap would
      # throttle its timers; a user's foreground window isn't napped. Turn it off so the
      # numbers measure the app, not the throttling.
      - name: Disable App Nap (macOS)
        if: runner.os == 'macOS'
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES

      - name: Install dependencies
        run: uv sync --locked

      - name: Environment
        run: |
          uv run python -c "import platform, sqlite3, sys; print('python', sys.version.split()[0]); print('sqlite3', sqlite3.sqlite_version); print('platform', platform.platform(), platform.machine())"
          nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "cpus: $NUMBER_OF_PROCESSORS"

      - name: Generate the 300k tree
        run: uv run python benchmarks/gen_tree.py "$RUNNER_TEMP/tree300k" --files 300000

      - name: Engine benchmark (acceptance matrices, scale 1)
        run: |
          mkdir -p bench-out
          extra=""
          # macOS: walker threads 1, 2, 4, 8 on APFS, to settle the default (design I.1.2)
          if [ "$RUNNER_OS" = "macOS" ]; then extra="--walker-threads 1,2,4,8"; fi
          uv run python benchmarks/bench_engine.py --tree "$RUNNER_TEMP/tree300k" --scale 1 \
            --out "bench-out/bench-engine-${{ matrix.os }}.json" $extra

      - name: App benchmark (real window and engine process)
        run: |
          uv run python benchmarks/bench_app.py --tree "$RUNNER_TEMP/tree300k" \
            --out "bench-out/bench-app-${{ matrix.os }}.json"

      - name: Summary
        if: always()
        run: uv run python benchmarks/ci_summary.py bench-out "${{ matrix.os }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-out/*.json
          if-no-files-found: error

  # workflow_dispatch with macos_profile=true: only this job runs. Profiles the GUI thread while
  # typing (offscreen and the real cocoa platform) and puts the report into the job summary.
  profile:
    name: Profile (${{ matrix.os }}, ${{ matrix.qpa }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        qpa: [offscreen, cocoa]
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use a throwaway app cache dir
        run: echo "FAST_FILE_SEARCH_CACHE_DIR=$RUNNER_TEMP/ffs-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Disable App Nap
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate the 300k tree
        run: uv run python benchmarks/gen_tree.py "$RUNNER_TEMP/tree300k" --files 300000

      - name: Profile the GUI thread while typing
        run: |
          sysctl -n hw.ncpu machdep.cpu.brand_string || true
          uv run python benchmarks/bench_app.py --tree "$RUNNER_TEMP/tree300k"             --profile-gui "prof-out/${{ matrix.os }}-${{ matrix.qpa }}"

      - name: Summary
        if: always()
        run: |
          f="prof-out/${{ matrix.os }}-${{ matrix.qpa }}/gui-profile.txt"
          {
            echo "### GUI profile (${{ matrix.os }}, ${{ matrix.qpa }})"
            echo '```'
            if [ -f "$f" ]; then head -c 400000 "$f"; else echo "no report"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-${{ matrix.os }}-${{ matrix.qpa }}
          path: prof-out/
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="$INPUT_TAG"; fi
          version="$(python3 build.py --print-version)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match pyproject.toml version 'v$version'"
            exit 1
          fi
          case "$version" in *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*|*dev*) pre=true ;; *) pre=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-files

      - name: Write release notes
        env:
          V: ${{ steps.tag.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ls -l release-files
          n="Fast-File-Search-Pro-v$V"
          cat > release-notes.md <<EOF
          ## Fast File Search Pro v$V

          ### What's new in 2.0
          - **New search engine.** Indexing and searching run in a separate engine process, so the window stays responsive while a large disk is indexed. Every match is reachable (there is no result cap), counts are exact, and results update live as files change.
          - **Filter-aware suggestions.** Type and path suggestions come only from results that match your current filters. History suggestions are offered only when they would find something under those filters.
          - **New interface.** A search bar with filter chips (type, size, date, location, excludes), a library sidebar, a results list with sorting, and a preview and details pane. Light and dark themes.
          - **Search as you type.** Results appear as you type, with highlighted matches.
          - **Live index.** The watcher keeps the index current; safety rescans catch anything a watcher misses.
          - **Self-tested builds.** Every build runs a packaged self-test that starts the engine and checks its results against a file-system walk.

          ### Windows (x64)
          | File | Description |
          |---|---|
          | \`$n-Windows-x64-Setup.exe\` | Installer (Start menu entry, optional desktop icon, uninstaller) |
          | \`$n-Windows-x64-Portable.exe\` | Single-file portable executable, no installation |
          | \`$n-Windows-x64.zip\` | Portable folder build, unzip and run \`FastFileSearchPro.exe\` |

          > **SmartScreen:** the executables are not code-signed, so Windows may show *"Windows protected your PC"*. Click **More info → Run anyway**.

          ### macOS
          | File | Description |
          |---|---|
          | \`$n-macOS-arm64.dmg\` | Apple Silicon (M1 and later) |
          | \`$n-macOS-x86_64.dmg\` | Intel Macs |

          Open the DMG and drag **Fast File Search Pro** into **Applications**.

          > **Gatekeeper:** the app is ad-hoc signed and not notarized. On first launch, **right-click the app → Open → Open** (on macOS 15 and later, go to *System Settings → Privacy & Security → Open Anyway*). Alternatively, run \`xattr -dr com.apple.quarantine "/Applications/Fast File Search Pro.app"\`.

          ### Linux (x86_64, glibc 2.35+: Ubuntu 22.04+, Debian 12+, Fedora 36+, current Arch)
          | Distribution | File | Install |
          |---|---|---|
          | Debian / Ubuntu / Mint | \`$n-Linux-x86_64.deb\` | \`sudo apt install ./$n-Linux-x86_64.deb\` |
          | Fedora / RHEL 10 / openSUSE | \`$n-Linux-x86_64.rpm\` | \`sudo dnf install ./$n-Linux-x86_64.rpm\` |
          | Arch / Manjaro / EndeavourOS | \`$n-Linux-x86_64.pkg.tar.zst\` | \`sudo pacman -U $n-Linux-x86_64.pkg.tar.zst\` |
          | Any (portable) | \`$n-Linux-x86_64.tar.gz\` | \`tar xzf $n-Linux-x86_64.tar.gz && ./fast-file-search-pro-$V/fast-file-search-pro\` |

          After installing a package, start **Fast File Search Pro** from your application menu or run \`fast-file-search-pro\`.

          ### macOS folder permissions
          Fast File Search Pro indexes file names in folders you choose. File contents are not read.

          - **First launch:** macOS shows one permission prompt for each protected folder the app scans (Desktop, Documents, Downloads, and removable or network volumes). Choose **Allow** to let the app index that folder. If you choose **Don't Allow**, the app shows a warning for that folder and does not ask again. To change your answer, open *System Settings → Privacy & Security → Files and Folders* (or *Full Disk Access*) and switch Fast File Search Pro on.
          - **One permission for everything:** grant *Full Disk Access* in *System Settings → Privacy & Security*. The app then does not need the per-folder permissions.
          - **After an update:** the app is signed ad hoc (no Apple Developer ID), so macOS may treat each new build as a different app and forget earlier permissions. If a folder shows as not allowed after updating, allow it again in System Settings. This stays the case until the app is signed with a Developer ID.

          ### Known limitations
          - **macOS builds are CI-tested only and not notarized.** They are built, self-tested and launch-tested on GitHub's macOS runners, but have not been tried by hand on a real Mac. See the Gatekeeper note above.
          - **Linux desktop integration varies by desktop.** "Show in File Manager" uses the freedesktop \`FileManager1\` D-Bus interface and falls back to opening the parent folder. Move to Trash needs \`gio\`, \`trash-put\` or \`kioclient5\`. These were tested with mocks, not on every desktop. There is no tray icon on some desktops (for example GNOME without an AppIndicator extension); there, closing the window quits the app.
          - **Linux scans stay on one filesystem.** A scan rooted at \`/\` does not enter a separate \`/home\` partition or btrfs subvolumes (Fedora's default layout). Add those folders as index roots directly. The default root (your home folder) is not affected.
          - **Unsigned executables.** None of the downloads are code-signed (Windows shows SmartScreen, macOS shows Gatekeeper).
          - **Grid and column views are not included.** Results are shown as a list with a preview pane.
          - **OR binds tighter than AND in queries.** \`a b | c\` means \`a AND (b OR c)\`. Use \`case:\` for exact-case matching; names match accent-insensitively by default.
          - **macOS \`~/Library\` and Windows \`AppData\`** inside your home folder are skipped by default. Turn on the setting to include them.
          - **Windows long paths:** paths longer than 260 characters are reported as scan errors and skipped.

          ---
          Source code and issue tracker: $REPO_URL
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fast File Search Pro ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.tag.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: release-files/*
          fail_on_unmatched_files: true
